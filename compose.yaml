name: ritmo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ritmo
      POSTGRES_USER: ritmo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ritmo_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ritmo -d ritmo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      PGHOST: db
      PGDATABASE: ritmo
      PGUSER: ritmo
      PGPASSWORD: ${DB_PASSWORD:-ritmo_local}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
        restart: true

volumes:
  postgres_data:
