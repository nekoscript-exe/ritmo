# Combinar únicamente con compose.test.yaml, nunca con compose.yaml.
services:
  api-preview:
    build:
      context: ./api
      target: production
    environment:
      PGHOST: db-test
      PGDATABASE: ritmo_test
      PGUSER: ritmo_test
      PGPASSWORD: test-only-not-a-production-secret
    depends_on:
      db-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      test-only:
        aliases: [api]

  web-preview:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${DASHBOARD_TEST_PORT:-5180}:80"
    depends_on:
      api-preview:
        condition: service_healthy
    networks: [test-only, preview-access]

networks:
  # Solo Nginx accede a esta red para publicar el puerto en localhost.
  # La API y PostgreSQL permanecen exclusivamente en test-only (internal).
  preview-access:
    driver: bridge
    internal: false
